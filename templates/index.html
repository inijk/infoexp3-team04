<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>どうぶつゲーム</title>
    <!-- Flaskのurl_forを使ってstaticフォルダ内のCSSを読み込む -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- 2D物理エンジン Matter.js をCDNから読み込む -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
    <!-- 画面全体を「左パネル・中央ゲーム・右パネル」の横並びにするラッパー -->
    <div class="main-layout">

        <!-- 左側：ホールド枠（上）＋ 自分のランキングTOP3（下） -->
        <div class="left-column">
            <aside class="hold-panel">
                <h2>📦 ホールド</h2>
                <div id="hold-slot" class="hold-slot">
                    <span class="hold-empty">なし</span>
                </div>
                <button id="hold-btn" type="button" disabled>ホールド / 入替 (C / 右クリック)</button>
            </aside>

            <aside class="ranking-panel my-ranking-panel">
                <h2>🏆 自分の記録</h2>
                <p class="panel-subtitle"><strong id="my-ranking-name">-</strong> のTOP3</p>
                <ol id="my-ranking-list" class="ranking-list">
                    <li>ログイン後に表示されます</li>
                </ol>
            </aside>
        </div>

        <!-- 中央：ゲーム画面 -->
        <div class="game-container">
            <h1>どうぶつゲーム</h1>
            <div class="info-bar">
                <span>
                    プレイヤー: <strong id="player-name">未ログイン</strong>
                    <button id="logout-btn" class="hidden" type="button">切替</button>
                </span>
                <span>スコア: <strong id="score">0</strong></span>
                <span>次の動物: <span id="next-fruit">●</span></span>
            </div>

            <!-- 物理演算を描画するエリア -->
            <div id="canvas-wrapper">
                <!-- ログイン画面オーバーレイ -->
                <div id="login-overlay">
                    <h2>プレイヤー登録 / ログイン</h2>
                    <p class="login-note">初めての名前はそのまま新規登録されます</p>
                    <input type="text" id="username-input" placeholder="ユーザー名" maxlength="15">
                    <input type="password" id="password-input" placeholder="合言葉（パスワード）">
                    <p id="login-error" class="error-text"></p>
                    <button id="login-btn">ゲーム開始</button>
                </div>

                <!-- ゲームオーバー時のオーバーレイ -->
                <div id="game-over" class="hidden">
                    <h2>GAME OVER</h2>
                    <p id="final-score-text"></p>
                    <button onclick="location.reload()">もう一度遊ぶ</button>
                </div>
            </div>
            <p class="guide">マウス移動で位置調整 / クリックで落下</p>
        </div>

        <!-- 右側：全プレイヤーのランキング -->
        <aside class="ranking-panel">
            <h2>👑 全体ランキング</h2>
            <p class="panel-subtitle">全プレイヤー TOP10</p>
            <ol id="global-ranking-list" class="ranking-list">
                <li>読み込み中...</li>
            </ol>
        </aside>

    </div>

    <!-- ゲームロジックのJSを読み込む前に、Flask側から画像パスを渡す -->
    <script>
        const FLASK_IMAGE_URLS = [
            "{{ url_for('static', filename='images/hamster.png') }}",
            "{{ url_for('static', filename='images/hedgehog.png') }}",
            "{{ url_for('static', filename='images/parrot.png') }}",
            "{{ url_for('static', filename='images/koala.png') }}",
            "{{ url_for('static', filename='images/sheep.png') }}",
            "{{ url_for('static', filename='images/lion.png') }}",
            "{{ url_for('static', filename='images/hippo.png') }}",
            "{{ url_for('static', filename='images/elephant.png') }}"
        ];
    </script>

    <!-- ゲームロジックのJSを読み込む -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
